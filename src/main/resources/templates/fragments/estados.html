<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Etiquetas de color para los estados de los documentos -->

<!-- Entradas y salidas: REGISTRADA / ANULADA -->
<span th:fragment="documento(valor)"
      th:class="${valor == 'ANULADA'} ? 'etiqueta apagada' : 'etiqueta ok'"
      th:text="${valor}">REGISTRADA</span>

<!-- Despachos: PENDIENTE, EN_RUTA, ENTREGADO, DEVUELTO, CANCELADO -->
<span th:fragment="despacho(valor)"
      th:class="${valor == 'ENTREGADO'} ? 'etiqueta ok'
              : (${valor == 'EN_RUTA'} ? 'etiqueta info'
              : (${valor == 'PENDIENTE'} ? 'etiqueta aviso'
              : (${valor == 'DEVUELTO'} ? 'etiqueta mal' : 'etiqueta apagada')))"
      th:text="${valor == 'EN_RUTA'} ? 'EN RUTA' : ${valor}">PENDIENTE</span>

<!-- Movimientos del kardex: ENTRADA / SALIDA -->
<span th:fragment="movimiento(valor)"
      th:class="${valor == 'ENTRADA'} ? 'etiqueta ok' : 'etiqueta info'"
      th:text="${valor}">ENTRADA</span>

</body>
</html>
