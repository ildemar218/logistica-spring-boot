<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registro</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="centrado">
    <div class="tarjeta">
        <h1>Registro de usuario</h1>
        <p class="subtitulo">Completa los datos para crear tu cuenta.</p>

        <div class="mensaje ok" th:if="${param.exito}">
            Registro exitoso. Ya puedes <a th:href="@{/login}">iniciar sesión</a>.
        </div>

        <form th:action="@{/registro}" th:object="${usuario}" method="post">
            <div class="campo">
                <label for="login">Login</label>
                <input type="text" id="login" th:field="*{login}">
                <span class="error" th:if="${#fields.hasErrors('login')}" th:errors="*{login}"></span>
            </div>
            <div class="campo">
                <label for="nombre">Nombre</label>
                <input type="text" id="nombre" th:field="*{nombre}">
                <span class="error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></span>
            </div>
            <div class="campo">
                <label for="apellido">Apellido</label>
                <input type="text" id="apellido" th:field="*{apellido}">
                <span class="error" th:if="${#fields.hasErrors('apellido')}" th:errors="*{apellido}"></span>
            </div>
            <div class="campo">
                <label for="email">Correo</label>
                <input type="text" id="email" th:field="*{email}">
                <span class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" th:field="*{password}">
                <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>
            <button class="boton" type="submit">Registrarse</button>
        </form>

        <div class="enlaces">
            <a th:href="@{/login}">Ya tengo cuenta</a> |
            <a th:href="@{/home}">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
