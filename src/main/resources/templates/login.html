<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="centrado">
    <div class="tarjeta">
        <h1>Iniciar sesión</h1>
        <p class="subtitulo">Ingresa tu login y tu contraseña.</p>

        <div class="mensaje mal" th:if="${param.error}">Login o contraseña incorrectos.</div>
        <div class="mensaje ok" th:if="${param.logout}">Cerraste sesión correctamente.</div>

        <form th:action="@{/login}" method="post">
            <div class="campo">
                <label for="username">Login</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="campo">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" required>
            </div>
            <button class="boton" type="submit">Entrar</button>
        </form>

        <div class="enlaces">
            <a th:href="@{/registro}">Crear una cuenta</a> |
            <a th:href="@{/home}">Volver al inicio</a>
        </div>
    </div>
</body>
</html>
