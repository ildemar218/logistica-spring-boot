<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orden de compra</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app">
  <header th:replace="~{fragments/menu :: menu}"></header>
  <main>
    <div class="titulo-pagina">
      <h1 th:text="${'Orden de compra ' + orden.numero}">Orden de compra</h1>
      <a class="boton secundario" th:href="@{/ordenes-compra/}">Volver al listado</a>
    </div>

    <p class="mensaje ok" th:if="${mensaje}" th:text="${mensaje}"></p>
    <p class="mensaje mal" th:if="${error}" th:text="${error}"></p>

    <dl class="ficha">
      <div><dt>Estado</dt>
        <dd><span th:replace="~{fragments/estados :: orden(${orden.estado})}"></span></dd></div>
      <div><dt>Fecha</dt><dd th:text="${#temporals.format(orden.fecha, 'dd/MM/yyyy')}"></dd></div>
      <div><dt>Entrega esperada</dt>
        <dd th:text="${orden.fechaEntregaEsperada != null} ? ${#temporals.format(orden.fechaEntregaEsperada, 'dd/MM/yyyy')} : '—'"></dd></div>
      <div><dt>Recibida</dt>
        <dd th:text="${orden.fechaRecepcion != null} ? ${#temporals.format(orden.fechaRecepcion, 'dd/MM/yyyy HH:mm')} : '—'"></dd></div>
      <div><dt>Proveedor</dt><dd th:text="${orden.proveedorNombre}"></dd></div>
      <div><dt>Bodega de destino</dt><dd th:text="${orden.bodegaNombre}"></dd></div>
      <div><dt>Observación</dt><dd th:text="${orden.observacion != null} ? ${orden.observacion} : '—'"></dd></div>
    </dl>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr><th>Código</th><th>Producto</th><th class="num">Cantidad</th>
              <th class="num">Costo unitario</th><th class="num">Subtotal</th></tr>
        </thead>
        <tbody>
          <tr th:each="d : ${orden.detalles}">
            <td th:text="${d.productoCodigo}"></td>
            <td th:text="${d.productoNombre}"></td>
            <td class="num" th:text="${d.cantidad}"></td>
            <td class="num" th:text="${#numbers.formatDecimal(d.costoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="num" th:text="${#numbers.formatDecimal(d.subtotal, 1, 'POINT', 2, 'COMMA')}"></td>
          </tr>
        </tbody>
        <tfoot>
          <tr><td colspan="4" class="num">Subtotal</td>
              <td class="num" th:text="${#numbers.formatDecimal(orden.subtotal, 1, 'POINT', 2, 'COMMA')}"></td></tr>
          <tr><td colspan="4" class="num">IVA 19 %</td>
              <td class="num" th:text="${#numbers.formatDecimal(orden.iva, 1, 'POINT', 2, 'COMMA')}"></td></tr>
          <tr><td colspan="4" class="num">Total</td>
              <td class="num" th:text="${#numbers.formatDecimal(orden.total, 1, 'POINT', 2, 'COMMA')}"></td></tr>
        </tfoot>
      </table>
    </div>

    <div class="acciones" th:if="${orden.estado == 'PENDIENTE'}">
      <form th:action="@{/ordenes-compra/{id}/recibir(id=${orden.ordenId})}" method="post"
            onsubmit="return confirm('¿Confirmar que la mercancía llegó a la bodega? Se sumará al inventario.')">
        <button class="boton exito" type="submit">Registrar recepción en bodega</button>
      </form>
      <form th:action="@{/ordenes-compra/{id}/anular(id=${orden.ordenId})}" method="post"
            onsubmit="return confirm('¿Anular esta orden de compra?')">
        <button class="boton peligro" type="submit">Anular orden</button>
      </form>
    </div>
  </main>
</body>
</html>
