<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Órdenes de compra</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app">
  <header th:replace="~{fragments/menu :: menu}"></header>
  <main>
    <div class="titulo-pagina">
      <h1>Órdenes de compra</h1>
      <a class="boton" th:href="@{/ordenes-compra/crear}">Crear orden de compra</a>
    </div>

    <form class="buscador" th:action="@{/ordenes-compra/}" method="get">
      <label for="estado">Estado</label>
      <select id="estado" name="estado">
        <option value="">Todos</option>
        <option value="PENDIENTE" th:selected="${estado == 'PENDIENTE'}">Pendiente</option>
        <option value="RECIBIDA" th:selected="${estado == 'RECIBIDA'}">Recibida</option>
        <option value="ANULADA" th:selected="${estado == 'ANULADA'}">Anulada</option>
      </select>
      <button class="boton" type="submit">Filtrar</button>
    </form>

    <p class="mensaje ok" th:if="${mensaje}" th:text="${mensaje}"></p>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr><th>Número</th><th>Fecha</th><th>Proveedor</th><th>Bodega destino</th>
              <th>Estado</th><th class="num">Total</th><th>Acciones</th></tr>
        </thead>
        <tbody>
          <tr th:each="o : ${ordenes}">
            <td th:text="${o.numero}"></td>
            <td th:text="${#temporals.format(o.fecha, 'dd/MM/yyyy')}"></td>
            <td th:text="${o.proveedorNombre}"></td>
            <td th:text="${o.bodegaNombre}"></td>
            <td><span th:replace="~{fragments/estados :: orden(${o.estado})}"></span></td>
            <td class="num" th:text="${#numbers.formatDecimal(o.total, 1, 'POINT', 2, 'COMMA')}"></td>
            <td><a th:href="@{/ordenes-compra/{id}(id=${o.ordenId})}">Ver</a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(ordenes)}">
            <td colspan="7" class="vacio">No hay órdenes de compra para mostrar.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
