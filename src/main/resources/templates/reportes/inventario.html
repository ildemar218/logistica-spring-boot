<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reporte de inventario</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app">
  <header th:replace="~{fragments/menu :: menu}"></header>
  <main>
    <div class="titulo-pagina">
      <h1>Inventario disponible</h1>
      <div class="acciones no-imprimir">
        <a class="boton secundario" th:href="@{/reportes/inventario.csv(bodegaId=${bodegaId},productoId=${productoId})}">Exportar a Excel (CSV)</a>
        <button class="boton secundario" type="button" onclick="window.print()">Imprimir / PDF</button>
      </div>
    </div>

    <form class="buscador no-imprimir" th:action="@{/reportes/inventario}" method="get">
      <label for="bodegaId">Filtrar por bodega y producto</label>
      <select id="bodegaId" name="bodegaId">
        <option value="">Todas las bodegas</option>
        <option th:each="b : ${bodegas}" th:value="${b.bodegaId}" th:text="${b.nombre}" th:selected="${b.bodegaId == bodegaId}"></option>
      </select>
      <select id="productoId" name="productoId" aria-label="Producto">
        <option value="">Todos los productos</option>
        <option th:each="p : ${productos}" th:value="${p.productoId}" th:text="${p.codigo + ' - ' + p.nombre}" th:selected="${p.productoId == productoId}"></option>
      </select>
      <button class="boton" type="submit">Generar</button>
    </form>

    <p class="subtitulo">
      <span th:text="${'Generado el ' + #temporals.format(generado, 'dd/MM/yyyy')}"></span> ·
      <span th:text="${'Unidades: ' + unidadesTotal}"></span> ·
      <span th:text="${'Valor a costo: $ ' + #numbers.formatDecimal(valorTotal, 1, 'POINT', 2, 'COMMA')}"></span>
    </p>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr><th>Bodega</th><th>Código</th><th>Producto</th><th class="num">Cantidad</th>
              <th class="num">Costo unitario</th><th class="num">Valor</th></tr>
        </thead>
        <tbody>
          <tr th:each="e : ${existencias}">
            <td th:text="${e.bodegaNombre}"></td>
            <td th:text="${e.productoCodigo}"></td>
            <td th:text="${e.productoNombre}"></td>
            <td class="num" th:text="${e.cantidad + ' ' + e.unidadMedida}"></td>
            <td class="num" th:text="${#numbers.formatDecimal(e.costoUnitario, 1, 'POINT', 2, 'COMMA')}"></td>
            <td class="num" th:text="${#numbers.formatDecimal(e.valorTotal, 1, 'POINT', 2, 'COMMA')}"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(existencias)}"><td colspan="6" class="vacio">No hay existencias con esos filtros.</td></tr>
        </tbody>
      </table>
    </div>

    <h2>Alertas de stock mínimo</h2>
    <div class="tabla-contenedor">
      <table>
        <thead><tr><th>Código</th><th>Producto</th><th class="num">Stock total</th><th class="num">Mínimo</th><th class="num">Sugerido reabastecer</th></tr></thead>
        <tbody>
          <tr th:each="r : ${alertas}">
            <td th:text="${r.codigo}"></td>
            <td th:text="${r.nombre}"></td>
            <td class="num"><span class="etiqueta mal" th:text="${r.total}"></span></td>
            <td class="num" th:text="${r.stockMinimo}"></td>
            <td class="num" th:text="${r.sugeridoComprar}"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(alertas)}"><td colspan="5" class="vacio">Sin alertas.</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
