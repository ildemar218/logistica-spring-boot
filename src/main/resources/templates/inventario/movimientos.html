<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kardex</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app">
  <header th:replace="~{fragments/menu :: menu}"></header>
  <main>
    <h1>Kardex de inventario</h1>
    <p class="subtitulo">Historial de entradas y salidas, con el saldo que quedó en la bodega después de cada movimiento.</p>

    <form class="buscador" th:action="@{/movimientos}" method="get">
      <label for="productoId">Filtrar por producto y bodega</label>
      <select id="productoId" name="productoId">
        <option value="">Todos los productos</option>
        <option th:each="p : ${productos}" th:value="${p.productoId}" th:text="${p.codigo + ' - ' + p.nombre}"
                th:selected="${p.productoId == productoId}"></option>
      </select>
      <select id="bodegaId" name="bodegaId" aria-label="Bodega">
        <option value="">Todas las bodegas</option>
        <option th:each="b : ${bodegas}" th:value="${b.bodegaId}" th:text="${b.nombre}"
                th:selected="${b.bodegaId == bodegaId}"></option>
      </select>
      <button class="boton" type="submit">Filtrar</button>
    </form>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr><th>Fecha</th><th>Tipo</th><th>Producto</th><th>Bodega</th><th class="num">Cantidad</th>
              <th class="num">Saldo</th><th>Referencia</th><th>Usuario</th></tr>
        </thead>
        <tbody>
          <tr th:each="m : ${movimientos}">
            <td th:text="${#temporals.format(m.fecha, 'dd/MM/yyyy HH:mm')}"></td>
            <td><span th:class="${m.tipo == 'ENTRADA'} ? 'etiqueta ok' : 'etiqueta info'" th:text="${m.tipo}"></span></td>
            <td th:text="${m.productoCodigo + ' - ' + m.productoNombre}"></td>
            <td th:text="${m.bodegaNombre}"></td>
            <td class="num" th:text="${(m.tipo == 'ENTRADA' ? '+' : '−') + m.cantidad}"></td>
            <td class="num" th:text="${m.saldo}"></td>
            <td th:text="${m.referencia}"></td>
            <td th:text="${m.usuario}"></td>
          </tr>
          <tr th:if="${#lists.isEmpty(movimientos)}">
            <td colspan="8" class="vacio">No hay movimientos para mostrar.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
