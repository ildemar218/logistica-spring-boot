<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Despachos</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app">
  <header th:replace="~{fragments/menu :: menu}"></header>
  <main>
    <div class="titulo-pagina">
      <h1 th:text="${permisos.soloTransportador} ? 'Mis despachos' : 'Órdenes de despacho'">Despachos</h1>
      <a class="boton" th:if="${permisos.gestionDespachos}" th:href="@{/despachos/crear}">Crear orden de despacho</a>
    </div>

    <form class="buscador" th:action="@{/despachos/}" method="get">
      <label for="estado">Estado de entrega</label>
      <select id="estado" name="estado">
        <option value="">Todos</option>
        <option value="PENDIENTE" th:selected="${estado == 'PENDIENTE'}">Pendiente</option>
        <option value="EN_RUTA" th:selected="${estado == 'EN_RUTA'}">En ruta</option>
        <option value="ENTREGADO" th:selected="${estado == 'ENTREGADO'}">Entregado</option>
        <option value="DEVUELTO" th:selected="${estado == 'DEVUELTO'}">Devuelto</option>
        <option value="CANCELADO" th:selected="${estado == 'CANCELADO'}">Cancelado</option>
      </select>
      <button class="boton" type="submit">Filtrar</button>
    </form>

    <p class="mensaje ok" th:if="${mensaje}" th:text="${mensaje}"></p>

    <div class="tabla-contenedor">
      <table>
        <thead>
          <tr><th>Número</th><th>Fecha</th><th>Cliente</th><th>Bodega</th><th>Transportador</th>
              <th>Estado</th><th class="num">Total</th><th></th></tr>
        </thead>
        <tbody>
          <tr th:each="d : ${despachos}">
            <td th:text="${d.numero}"></td>
            <td th:text="${#temporals.format(d.fecha, 'dd/MM/yyyy')}"></td>
            <td th:text="${d.clienteNombre}"></td>
            <td th:text="${d.bodegaNombre}"></td>
            <td th:text="${d.transportadorNombre}"></td>
            <td><span th:replace="~{fragments/estados :: despacho(${d.estado})}"></span></td>
            <td class="num" th:text="${#numbers.formatDecimal(d.total, 1, 'POINT', 2, 'COMMA')}"></td>
            <td><a th:href="@{/despachos/{id}(id=${d.despachoId})}">Ver</a></td>
          </tr>
          <tr th:if="${#lists.isEmpty(despachos)}">
            <td colspan="8" class="vacio">No hay despachos para mostrar.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</body>
</html>
