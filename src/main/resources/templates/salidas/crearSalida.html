<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrar salida</title>
  <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="app">
  <header th:replace="~{fragments/menu :: menu}"></header>
  <main>
    <h1>Registrar salida de mercancía</h1>
    <p class="subtitulo">Venta directa, merma, ajuste o consumo interno. Si un producto no tiene existencias suficientes, la salida se rechaza completa.</p>

    <form class="formulario ancho" th:action="@{/salidas/crear}" th:object="${salidaDto}" method="post">
      <div class="mensaje mal" th:if="${#fields.hasErrors('*')}">
        <p th:each="err : ${#fields.allErrors()}" th:text="${err}"></p>
      </div>

      <div class="campo">
        <label for="numero">Número</label>
        <input id="numero" th:field="*{numero}" maxlength="20" required>
      </div>
      <div class="campo">
        <label for="fecha">Fecha</label>
        <input id="fecha" type="date" th:field="*{fecha}" required>
      </div>
      <div class="campo">
        <label for="tipo">Tipo de salida</label>
        <select id="tipo" th:field="*{tipo}" required>
          <option value="">Seleccione...</option>
          <option th:each="t : ${tipos}" th:value="${t}" th:text="${#strings.replace(t, '_', ' ')}"></option>
        </select>
      </div>
      <div class="campo">
        <label for="bodegaId">Bodega</label>
        <select id="bodegaId" th:field="*{bodegaId}" required>
          <option value="">Seleccione...</option>
          <option th:each="b : ${bodegas}" th:value="${b.bodegaId}"
                  th:text="${b.codigo + ' - ' + b.nombre}"></option>
        </select>
      </div>
      <div class="campo" id="campoCliente">
        <label for="clienteId">Cliente (solo ventas)</label>
        <select id="clienteId" th:field="*{clienteId}">
          <option value="">Seleccione...</option>
          <option th:each="c : ${clientes}" th:value="${c.clienteId}"
                  th:text="${c.numeroDocumento + ' - ' + c.nombres}"></option>
        </select>
      </div>
      <div class="campo ancho-completo">
        <label for="motivo">Motivo</label>
        <input id="motivo" th:field="*{motivo}" maxlength="255" required
               placeholder="Ej.: venta de mostrador, producto vencido, corrección de conteo">
      </div>

      <div class="ancho-completo">
        <h2>Productos</h2>
        <div class="tabla-contenedor">
          <table id="detalle" class="detalle" data-precio="">
            <thead><tr><th>Producto</th><th class="col-disponible">Disponible</th><th class="col-cantidad">Cantidad</th><th></th></tr></thead>
            <tbody>
              <tr class="fila" th:each="d, st : ${salidaDto.detalles}">
                <td><select class="producto" th:name="|detalles[${st.index}].productoId|"
                            th:attr="data-selected=${d.productoId}" required></select></td>
                <td class="col-disponible">—</td>
                <td><input class="cantidad" type="number" min="1" step="1" required
                           th:name="|detalles[${st.index}].cantidad|" th:value="${d.cantidad}"></td>
                <td><button type="button" class="enlace-peligro quitar">Quitar</button></td>
              </tr>
            </tbody>
          </table>
        </div>
        <p><button type="button" class="boton secundario" id="agregarFila">+ Agregar producto</button></p>
      </div>

      <div class="acciones">
        <button class="boton" type="submit">Registrar salida</button>
        <a class="boton secundario" th:href="@{/salidas/}">Cancelar</a>
      </div>
    </form>
  </main>

  <template id="plantillaFila">
    <tr class="fila">
      <td><select class="producto" name="detalles[0].productoId" required></select></td>
      <td class="col-disponible">—</td>
      <td><input class="cantidad" type="number" min="1" step="1" value="1" name="detalles[0].cantidad" required></td>
      <td><button type="button" class="enlace-peligro quitar">Quitar</button></td>
    </tr>
  </template>
  <select id="opcProductos" hidden disabled>
    <option th:each="p : ${productos}" th:value="${p.productoId}"
            th:text="${p.codigo + ' - ' + p.nombre + ' (' + p.unidadMedida + ')'}"></option>
  </select>
  <script th:inline="javascript">window.STOCK = /*[[${stock}]]*/ {};</script>
  <script th:src="@{/js/detalle.js}"></script>
</body>
</html>
